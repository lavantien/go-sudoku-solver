name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - run: curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.15.0
      - run: go install mvdan.cc/gofumpt@v0.12.0
      - run: make build
      - run: make test
      - run: make race
      - run: make vet
      - run: make fmt-check
      - run: make lint
      - run: make typecheck
      - run: make sloc
      - run: make e2e
      - run: make coverage
